<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Mode：方案预检与应用</title>
  <script src="../dist/core/JquanUI@Core.js"></script>
</head>
<body class="bg-slate-50 p-4 text-slate-900 sm:p-8">
  <div class="mx-auto max-w-2xl">
    <h1 class="text-2xl font-bold">先核对，再恢复客户方案</h1>
    <p class="mt-3 text-sm text-slate-600">生成方案会模拟一次客户编辑并还原页面。预检只读；应用后可在审查工具内撤销，也可点击还原。</p>
    <nav class="mt-5 flex flex-wrap gap-2" aria-label="方案操作">
      <button id="prepare" type="button" class="rounded-lg bg-blue-600 px-4 py-2 text-white">1. 生成示例方案</button>
      <button id="preflight" type="button" disabled class="rounded-lg border border-slate-300 bg-white px-4 py-2 disabled:opacity-50">2. 预检方案</button>
      <button id="apply" type="button" disabled class="rounded-lg bg-slate-900 px-4 py-2 text-white disabled:opacity-50">3. 应用预览</button>
      <button id="restore" type="button" disabled class="rounded-lg border border-slate-300 bg-white px-4 py-2 disabled:opacity-50">还原页面</button>
    </nav>
    <p id="status" role="status" class="mt-4 text-sm text-slate-600">尚未导入审查组件。</p>
    <main id="preview" class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      <h2 id="client-title" data-jq-review-key="client-title" class="text-xl font-semibold">原始页面标题</h2>
      <p class="mt-3 text-slate-600">这里保留页面原有内容与结构。</p>
    </main>
    <pre id="report" class="mt-6 max-w-full overflow-auto rounded-xl bg-slate-900 p-4 text-xs text-slate-100" aria-label="方案报告">等待生成方案</pre>
  </div>
  <script>
    const status = document.getElementById('status'), report = document.getElementById('report');
    const controls = Object.fromEntries(['prepare', 'preflight', 'apply', 'restore'].map(id => [id, document.getElementById(id)]));
    let review, plan, pending;
    async function session() {
      review = await (pending || (pending = JquanUI.import('reviewMode')));
      if (!review.state().enabled) review.configure({ enabled: true, root: '#preview', allowURL: false });
      review.open();
      return review;
    }
    async function run(action) {
      try { await action(); }
      catch (_) { pending = null; status.textContent = '加载未完成，请重试。'; }
    }
    controls.prepare.addEventListener('click', () => run(async () => {
      const api = await session();
      if (!api.reset()) { status.textContent = '页面已有外部更新，请核对当前修改。'; return; }
      api.select('#client-title'); api.setText('客户确认的新标题'); api.setUtility('font-size', 'text-3xl');
      plan = JSON.parse(api.exportPlan('json'));
      api.reset(); api.close();
      report.textContent = JSON.stringify(plan, null, 2);
      controls.preflight.disabled = false; controls.apply.disabled = true; controls.restore.disabled = true;
      status.textContent = '方案已生成，页面已还原。请先预检。';
    }));
    controls.preflight.addEventListener('click', () => run(async () => {
      const api = await session(), result = api.applyPlan(plan); api.close();
      report.textContent = JSON.stringify(result, null, 2); controls.apply.disabled = !result.ok;
      status.textContent = result.ok ? '预检通过，页面未变化。' : '存在冲突，请核对报告。';
    }));
    controls.apply.addEventListener('click', () => run(async () => {
      const api = await session(), result = api.applyPlan(plan, { dryRun: false });
      report.textContent = JSON.stringify(result, null, 2);
      controls.apply.disabled = true; controls.restore.disabled = !result.ok;
      status.textContent = result.ok ? '方案已应用，可使用审查工具撤销或点击还原。' : '应用中止，请核对报告。';
    }));
    controls.restore.addEventListener('click', () => run(async () => {
      const api = await session(), restored = api.reset(); api.close();
      status.textContent = restored ? '页面已还原，可重新预检方案。' : '页面已有外部更新，请核对冲突。';
      controls.restore.disabled = restored;
    }));
    addEventListener('pagehide', () => review?.destroy(), { once: true });
  </script>
</body>
</html>
