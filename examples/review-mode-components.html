<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Mode 组件配置预览</title>
  <script src="../dist/core/JquanUI@Core.js"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-900">
  <main id="preview" class="mx-auto max-w-xl">
    <p class="mb-2 text-sm font-semibold text-blue-600">JQUANUI REVIEW MODE</p>
    <h1 class="text-3xl font-bold">把修改意见，直接变成预览</h1>
    <p class="mt-3 mb-6 text-slate-600">打开审查后可调整轮播的自动播放和切换间隔，修改清单只保留最终配置。</p>
    <section id="sample-carousel" data-jq-review-key="sample-carousel" class="h-48 rounded-2xl shadow-lg" aria-label="组件配置示例">
      <article jq-carousel-item class="flex h-full items-center justify-center bg-blue-100 text-blue-900 text-2xl font-semibold">保留内容，调整节奏</article>
      <article jq-carousel-item class="flex h-full items-center justify-center bg-indigo-100 text-indigo-900 text-2xl font-semibold">随时撤销，复制方案</article>
    </section>
    <button id="start-review" type="button" class="mt-6 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium disabled:opacity-50">打开轮播配置审查</button>
    <p id="load-status" role="status" class="mt-3 text-sm text-slate-500"></p>
  </main>
  <script>
    // 本示例先挂载业务轮播，再按需加载审查；Review Mode 自身不下载业务组件。
    const start = document.getElementById('start-review');
    start.addEventListener('click', async () => {
      start.disabled = true;
      try {
        const carousel = await JquanUI.import('carousel');
        if (!carousel.getHandle('#sample-carousel')) carousel.mount('#sample-carousel', { autoplay: false, interval: 4000, infinite: false });
        const review = await JquanUI.import('reviewMode');
        if (!review.state().enabled) review.configure({ enabled: true, root: '#preview', allowURL: false });
        review.open(); review.select('#sample-carousel');
        document.getElementById('load-status').textContent = '';
      } catch (error) {
        document.getElementById('load-status').textContent = '加载失败，请再次点击重试。';
      } finally { start.disabled = false; }
    });
  </script>
</body>
</html>
