<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JquanUI Components Docs</title>
    <link href="assets/phosphor/regular/style.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <script>
        window.JQUAN_CONFIG = {
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(99 102 241)',
                        secondary: 'rgb(168 85 247)',
                        success: 'rgb(34 197 94)',
                        danger: 'rgb(239 68 68)',
                        warning: 'rgb(245 158 11)'
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'Consolas', 'Monaco', 'monospace']
                    }
                }
            }
        };
    </script>
    <script src="dist/core/JquanUI@Core.js?v=4.72.0" data-jquan-core-src></script>
    <script src="dist/data/JquanUI@Data.js"></script>
    <script src="dist/components/JquanUI@components.js"></script>
</head>
<body class="bg-white text-slate-800 h-screen flex overflow-hidden antialiased selection:bg-primary/30 selection:text-slate-900">
    <aside class="hidden lg:flex w-64 bg-slate-50 border-r border-slate-200 flex-col transition-all z-20 shrink-0">
        <div data-jquan-component-sidebar-head></div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="component-sidebar"></nav>

    </aside>

    <div class="flex-1 flex flex-col h-screen min-w-0 bg-white">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-3 sm:px-4 lg:px-8 z-10 sticky top-0 gap-2">
            <div data-jquan-docs-nav data-active="components"></div>
            <div data-jquan-component-header class="flex flex-1 items-center justify-between gap-3"></div>
        </header>

        <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 relative" id="component-app"></main>
        <footer data-jquan-docs-footer class="border-t border-slate-100 bg-white px-4 py-3 sm:px-6 lg:px-8"></footer>
    </div>

    <script src="js/docs-shell.js?v=4.72.0"></script>
    <script src="js/components-docs.js"></script>
</body>
</html>
