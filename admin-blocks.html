<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JquanUI Admin Blocks</title>
    <link href="assets/phosphor/regular/style.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <script>
        window.JQUAN_CONFIG = {
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(99 102 241)',
                        secondary: 'rgb(168 85 247)',
                        success: 'rgb(34 197 94)',
                        danger: 'rgb(239 68 68)',
                        warning: 'rgb(245 158 11)'
                    }
                }
            }
        };
    </script>
    <script src="dist/core/JquanUI@Core.js?v=4.72.0" data-jquan-core-src></script>
    <script src="dist/components/JquanUI@components.js"></script>
</head>
<body class="bg-white text-slate-800 h-screen flex overflow-hidden antialiased selection:bg-primary/30 selection:text-slate-900">
    <aside class="hidden lg:flex w-64 bg-slate-50 border-r border-slate-200 flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 bg-white">
            <div class="w-7 h-7 bg-primary rounded-[6px] flex items-center justify-center text-white font-black text-lg shadow-sm shadow-primary/40">
                <i class="ph ph-layout"></i>
            </div>
            <span class="ml-2.5 font-bold text-[17px] tracking-tight text-slate-800">
                JquanUI<span class="text-primary">Admin Blocks</span>
            </span>
        </div>

        <div class="px-4 pt-4">
            <label class="relative block">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input
                    id="block-search"
                    type="text"
                    placeholder="&#25628;&#32034;&#22330;&#26223; / &#26631;&#31614; / &#32452;&#20214;"
                    class="w-full h-11 pl-10 pr-4 rounded-xl border border-slate-200 bg-white text-sm text-slate-700 outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"
                >
            </label>
        </div>

        <div class="px-4 pt-4">
            <div id="block-tags" class="flex gap-2 overflow-x-auto overflow-y-hidden whitespace-nowrap pb-1"></div>
        </div>

        <nav class="flex-1 min-h-0 overflow-y-auto py-4 px-3 space-y-1" id="block-sidebar"></nav>

    </aside>

    <div class="flex-1 flex flex-col h-screen min-w-0 bg-white">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-3 sm:px-4 lg:px-8 z-10 sticky top-0 gap-2">
            <div class="flex items-center gap-3">
            <div data-jquan-docs-nav data-active="blocks"></div>
                <div class="hidden lg:flex items-center gap-2 text-xs text-slate-400">
                    <span class="px-2 py-1 rounded-full bg-primary/10 text-primary border border-primary/10">Admin Blocks</span>
                    <span>&#22330;&#26223;&#12289;&#32452;&#21512;&#12289;&#20132;&#20114;&#21644;&#32467;&#26500;&#36755;&#20986;</span>
                </div>
            </div>
            <div class="text-xs text-slate-400 hidden lg:block" id="block-summary"></div>
        </header>

        <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 relative" id="block-app"></main>
        <footer data-jquan-docs-footer class="border-t border-slate-100 bg-white px-4 py-3 sm:px-6 lg:px-8"></footer>
    </div>

    <script src="js/docs-shell.js?v=4.72.0"></script>
    <script src="js/admin-blocks.js"></script>
</body>
</html>
