<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JquanUI 文档 - v4.72.0</title>
    
    <!-- [核心更改] 引入本地 Phosphor 图标库 -->
    <!-- 假设你的核心 css 文件叫 phosphor.css，如果不叫这个名字请按实际文件名修改 -->
    <link href="assets/phosphor/regular/style.css" rel="stylesheet">
    
    <!-- 引入外部 CSS 样式 -->
    <link href="css/app.css" rel="stylesheet">
    
    <script>
        window.JQUAN_CONFIG = {
            theme: {
                extend: {
                    colors: { 
                        primary: 'rgb(99 102 241)', 
                        secondary: 'rgb(168 85 247)',
                        'primary-dark': 'rgb(38, 180, 95)',
                        success: 'rgb(34 197 94)',
                        danger: 'rgb(239 68 68)',
                        warning: 'rgb(245 158 11)',
                        important: 'rgb(236 72 153)',
                        special: 'rgb(168 85 247)'
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'Consolas', 'Monaco', 'monospace'],
                    },
                    fluid: {
                        fontSize: {
                            display: { min: '2.25rem', preferred: '6vw', max: '4.5rem', lineHeight: '1.05' }
                        },
                        spacing: {
                            section: ['3rem', '6vw', '6rem']
                        }
                    }
                }
            }
        }
    </script>
    <!-- 配置必须优先于 Core，确保首屏主题变量可用 -->
    <script src="dist/core/JquanUI@Core.js?v=4.72.0" data-jquan-core-src></script>
    <script src="dist/components/template.js"></script>
</head>
<body class="bg-white text-slate-800 h-screen flex overflow-hidden antialiased selection:bg-primary/30 selection:text-slate-900">

    <aside class="hidden lg:flex w-64 bg-slate-50 border-r border-slate-200 flex-col transition-all z-20 shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 bg-white">
            <div class="w-7 h-7 bg-primary rounded-[6px] flex items-center justify-center text-white font-black text-lg shadow-sm shadow-primary/40">
                <!-- 替换为 Phosphor 的原子图标 -->
                <i class="ph ph-atom"></i>
            </div>
            <span class="ml-2.5 font-bold text-[17px] tracking-tight text-slate-800">JquanUI<span class="text-primary">Docs</span></span>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="sidebar-nav">
            <!-- 动态渲染 -->
        </nav>

    </aside>

    <div class="flex-1 flex flex-col h-screen min-w-0 bg-white">
        <header class="h-16 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-3 sm:px-4 lg:px-8 z-10 sticky top-0 gap-2 lg:gap-6">
            <div data-jquan-docs-nav data-active="css"></div>
            <div class="hidden md:block flex-1 max-w-xl">
                <button id="cmd-trigger" class="flex items-center w-full bg-slate-50 hover:bg-slate-100 text-slate-400 px-4 py-2 rounded-xl border border-slate-200/80 transition-all text-sm group shadow-sm">
                    <!-- 替换为 Phosphor 的放大镜图标 -->
                    <i class="ph ph-magnifying-glass text-lg mr-3 group-hover:text-primary transition-colors"></i>
                    <span>搜索组件、类名或用法...</span>
                    <span class="ml-auto flex gap-1">
                        <kbd class="border border-slate-200 rounded px-1.5 bg-white text-xs font-sans font-medium text-slate-500 shadow-sm">Ctrl</kbd>
                        <kbd class="border border-slate-200 rounded px-1.5 bg-white text-xs font-sans font-medium text-slate-500 shadow-sm">K</kbd>
                    </span>
                </button>
            </div>
            <div class="hidden md:flex items-center gap-4 text-slate-400">
                <!-- 替换为 Phosphor 的 GitHub 图标 -->
                <a href="#" class="hover:text-primary transition-colors" title="GitHub 仓库"><i class="ph ph-github-logo text-2xl"></i></a>
            </div>
        </header>

        <main class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 relative" id="app-container">
            <!-- 动态组件注入 -->
        </main>
        <footer data-jquan-docs-footer class="border-t border-slate-100 bg-white px-4 py-3 sm:px-6 lg:px-8"></footer>
    </div>

    <!-- 聚合搜索面板 -->
    <div id="cmd-palette" class="fixed inset-0 z-[100] flex items-start justify-center pt-[12vh] modal-enter hidden">
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" id="cmd-overlay"></div>
        <div id="cmd-content" class="relative bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden modal-content-enter border border-slate-200/50 ring-1 ring-black/5">
            <div class="flex items-center px-4 py-4 border-b border-slate-100">
                <!-- 替换为 Phosphor 的终端图标 -->
                <i class="ph ph-terminal text-primary text-xl ml-2"></i>
                <input type="text" id="cmd-input" class="flex-1 ml-3 bg-transparent text-slate-700 focus:outline-none text-lg placeholder-slate-300 font-medium" placeholder="搜索任何你想查的类名或组件..." autocomplete="off">
                <kbd class="border border-slate-100 rounded px-2 py-1 bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest">ESC</kbd>
            </div>
            <div id="cmd-results" class="max-h-[55vh] overflow-y-auto py-2">
                <div class="px-4 py-10 text-center text-slate-400 text-sm">
                    <!-- 替换为 Phosphor 的闪电图标 -->
                    <i class="ph ph-lightning text-4xl mb-4 text-slate-200 block"></i>
                    雷达已就绪，请输入关键词开始检索
                </div>
            </div>
        </div>
    </div>

    <!-- 引入外部 JS 逻辑 -->
    <script>
        (function () {
            if (window.location.protocol === 'file:') {
                document.addEventListener('DOMContentLoaded', function () {
                    var container = document.getElementById('app-container');
                    if (!container) return;

                    container.innerHTML = `
                        <div class="max-w-3xl">
                            <div class="mb-6">
                                <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-warning/10 text-warning text-xs font-bold tracking-wider uppercase">
                                    <i class="ph ph-warning-circle"></i>
                                    Local File Mode
                                </span>
                            </div>
                            <div class="rounded-2xl border border-slate-200 bg-white shadow-sm overflow-hidden">
                                <div class="px-6 py-5 border-b border-slate-200 bg-slate-50">
                                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">CSS 类文档需要通过本地服务打开</h1>
                                    <p class="mt-2 text-slate-600 text-sm leading-7">
                                        当前页面是通过 <code class="inline-code">file://</code> 直接打开的。CSS 文档核心依赖 ES Module 动态加载
                                        <code class="inline-code">content/*.js</code>，浏览器会在本地文件协议下拦截它，所以会出现模块 CORS 报错。
                                    </p>
                                </div>
                                <div class="p-6 grid gap-5">
                                    <div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
                                        <div class="font-semibold text-slate-800 mb-2">推荐打开方式</div>
                                        <pre class="!m-0"><code>npx serve .
# 或 VS Code Live Server
# 然后访问 http://localhost:xxxx</code></pre>
                                    </div>
                                    <div class="flex flex-wrap gap-3">
                                        <a href="components.html" class="inline-flex items-center gap-2 h-11 px-4 rounded-xl bg-primary text-white font-medium shadow-sm hover:opacity-95 transition-opacity">
                                            <i class="ph ph-cubes"></i>
                                            <span>先查看组件文档</span>
                                        </a>
                                        <a href="admin-blocks.html" class="inline-flex items-center gap-2 h-11 px-4 rounded-xl border border-slate-200 bg-white text-slate-700 font-medium hover:bg-slate-50 transition-colors">
                                            <i class="ph ph-layout"></i>
                                            <span>查看 UI 展示页</span>
                                        </a>
                                        <button id="load-css-docs-anyway" class="inline-flex items-center gap-2 h-11 px-4 rounded-xl border border-slate-200 bg-white text-slate-700 font-medium hover:bg-slate-50 transition-colors">
                                            <i class="ph ph-arrow-clockwise"></i>
                                            <span>仍然尝试加载</span>
                                        </button>
                                    </div>
                                    <p class="text-xs text-slate-400">
                                        说明：如果继续使用 <code class="inline-code">file://</code>，浏览器大概率仍会拒绝加载这些模块。
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;

                    var retryButton = document.getElementById('load-css-docs-anyway');
                    if (retryButton) {
                        retryButton.addEventListener('click', function () {
                            if (typeof window.bootDocApp === 'function') window.bootDocApp();
                        });
                    }
                });
                return;
            }

        })();
    </script>
    <script src="./js/docs-shell.js?v=4.72.0"></script>
    <script src="./js/app.js?v=4.72.0-1"></script>
</body>
</html>
